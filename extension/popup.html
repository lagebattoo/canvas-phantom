<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Phantom</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="logo">CP</div><div><h1>Canvas Phantom</h1><p>幻影 · 你的页面，你的设置。</p></div><span class="tag">FREE</span></header>
<main>
<section class="hero"><div><span class="eyebrow">CANVAS PHANTOM · 幻影</span><h2>你的页面，由你掌控</h2><p>永久免费 · 本地运行 · 无账号</p></div></section>
<section class="site"><div class="section-title"><h2>自动运行范围</h2><span id="site-state">检查中</span></div><p id="origin">—</p><p id="site-hint" class="hint"></p><div class="actions"><button id="reload" class="secondary">刷新本页</button></div></section>
<section class="features">
<label class="setting master"><span><strong>总开关</strong><small>关闭后停止处理并恢复可恢复的改动</small></span><input type="checkbox" id="enabled" role="switch"></label>
<div class="section-title"><h2>核心功能</h2><span>独立控制</span></div>
<label class="setting"><span><strong>焦点 / 可见性处理</strong><small>含输入焦点、pagehide/pageshow 注册及指定监听移除调用过滤</small></span><input type="checkbox" id="focus" role="switch"></label>
<label class="setting"><span><strong>隐藏文本清理</strong><small>仅处理指定正文区域内实际不可见的文本</small></span><input type="checkbox" id="cleaner" role="switch"></label>
<div class="section-title"><h2>配套界面</h2><span>不影响核心开关</span></div>
<label class="setting"><span><strong>浮动工具栏</strong><small>页面快捷开关；支持拖动与键盘移动</small></span><input type="checkbox" id="toolbar" role="switch"></label>
<label class="setting"><span><strong>状态面板</strong><small>查看真实计数、启用状态和恢复冲突</small></span><input type="checkbox" id="panel" role="switch"></label>
</section>
<section class="readout"><span class="dot"></span><p id="status" role="status">正在读取设置…</p></section>
<footer>v0.1.5 · 普通 HTTP/HTTPS 网页与符合条件的 iframe<br>总开关控制核心处理；关闭后刷新页面可重建监听操作。</footer>
</main><script src="core.js"></script><script src="popup.js"></script>
</body></html>
